# Gemini CLI installs an extension from the latest GitHub release when one
# exists, and reads gemini-extension.json and skills/ from the archive root.
# The skills live in plugins/oceantoken/skills for the other hosts, so each
# release gets one archive that lays them out the way Gemini CLI expects.
name: Gemini CLI extension archive

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the archive to
        required: true

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}

      - name: Check the manifest version matches the tag
        run: |
          version="$(jq -r .version gemini-extension.json)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "gemini-extension.json is ${version} but the release is ${TAG}" >&2
            exit 1
          fi

      - name: Build the archive
        run: |
          mkdir -p dist/oceantoken
          cp gemini-extension.json GEMINI.md LICENSE README.md dist/oceantoken/
          cp -R plugins/oceantoken/skills dist/oceantoken/skills
          # agents/openai.yaml is Codex-only metadata
          find dist/oceantoken/skills -type d -name agents -prune -exec rm -rf {} +
          tar -C dist/oceantoken -czf dist/oceantoken.tar.gz .
          tar -tzf dist/oceantoken.tar.gz

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" dist/oceantoken.tar.gz --clobber
