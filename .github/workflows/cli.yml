name: CLI tests

# The tests also check that the READMEs and INSTALL.md describe the CLI as it is.
on:
  push:
    paths: ["cli/**", "plugins/oceantoken/skills/**", "plugins/oceantoken/README.md", "README.md", "INSTALL.md", "GEMINI.md", ".github/workflows/cli.yml"]
  pull_request:
    paths: ["cli/**", "plugins/oceantoken/skills/**", "plugins/oceantoken/README.md", "README.md", "INSTALL.md", "GEMINI.md", ".github/workflows/cli.yml"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["18.17", "20", "22", "24"]
        include:
          - os: macos-latest
            node: "22"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Package contents
        run: npm pack --dry-run
