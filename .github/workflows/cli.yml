name: CLI tests

# The tests also check that the READMEs and INSTALL.md describe the CLI as it is.
on:
  # push only on main: a pull request's branch is already tested by the pull_request run, and pushing
  # to it used to start both (2026-10-30).
  push:
    branches: [main]
    paths: ["cli/**", "plugins/oceantoken/skills/**", "plugins/oceantoken/README.md", "README.md", "INSTALL.md", "GEMINI.md", ".github/workflows/cli.yml"]
  pull_request:
    paths: ["cli/**", "plugins/oceantoken/skills/**", "plugins/oceantoken/README.md", "README.md", "INSTALL.md", "GEMINI.md", ".github/workflows/cli.yml"]

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request replaces the run still going; main is never cancelled.
  group: cli-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["18.17", "20", "22", "24"]
        include:
          - os: macos-latest
            node: "22"
    runs-on: ${{ matrix.os }}
    # A run takes well under a minute; a hung npm test stops here, not at the 6-hour default.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Package contents
        run: npm pack --dry-run
